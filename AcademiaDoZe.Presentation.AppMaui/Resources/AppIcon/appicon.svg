<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Gradiente de Fundo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>

    <!-- Gradiente do Haltere -->
    <linearGradient id="barbellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3F4F6" />
      <stop offset="100%" stop-color="#9CA3AF" />
    </linearGradient>

    <!-- Gradiente de Energia/Destaque -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Sombra Projetada -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Fundo Arredondado (Proporção Padrão de Ícones) -->
  <rect width="1024" height="1024" rx="224" fill="url(#bgGrad)" />

  <!-- Grupo do Ícone com Sombra -->
  <g filter="url(#dropShadow)" transform="translate(512, 512) rotate(-45)">
    <!-- Barra Central -->
    <rect x="-180" y="-30" width="360" height="60" rx="15" fill="url(#barbellGrad)" />

    <!-- Discos Esquerdo (Anilhas) -->
    <rect x="-240" y="-120" width="60" height="240" rx="20" fill="url(#barbellGrad)" />
    <rect x="-310" y="-160" width="60" height="320" rx="24" fill="url(#accentGrad)" />

    <!-- Discos Direito (Anilhas) -->
    <rect x="180" y="-120" width="60" height="240" rx="20" fill="url(#barbellGrad)" />
    <rect x="250" y="-160" width="60" height="320" rx="24" fill="url(#accentGrad)" />

    <!-- Trava das Pontas -->
    <rect x="-340" y="-70" width="20" height="140" rx="8" fill="#6B7280" />
    <rect x="320" y="-70" width="20" height="140" rx="8" fill="#6B7280" />

    <!-- Raio / Sinal de Energia ao Centro -->
    <path d="M-20 -90 L25 -10 L-5 10 L20 90 L-25 10 L5 -10 Z" fill="#FACC15" />
  </g>
</svg>
